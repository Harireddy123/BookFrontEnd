<div class="login-page">
  <div class="illustration-box">
    <div class="illustration-circle">
      <img src="/images/sales.png" alt="Online Book Shopping" />
    </div>
    <h2 class="illustration-title">ONLINE BOOK SHOPPING</h2>
  </div>

  <mat-card class="login-card">
    <div class="tabs-header">
      <div class="tab active">LOGIN</div>
      <div class="tab" (click)="navigateToSignup()">SIGNUP</div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email Id</mat-label>
        <input matInput formControlName="email" />
        <mat-error *ngIf="emailControl?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="emailControl?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{
            hidePassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordControl?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>

      <button mat-flat-button color="warn" class="full-width submit-button">
        Login
      </button>
    </form>

    <div class="divider"><span>OR</span></div>

    <div class="social-buttons">
      <button mat-flat-button color="primary" class="facebook">Facebook</button>
      <button mat-stroked-button class="google">Google</button>
    </div>
  </mat-card>
</div>
